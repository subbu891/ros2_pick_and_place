object_detector:
  ros__parameters:
    use_sim_time: true
    target_frame: world
    # Set explicitly: Gazebo Fortress may not stamp images with our frame name
    camera_frame: camera_optical_frame
    object_height: 0.04
    rgb_topic: /camera/image
    depth_topic: /camera/depth_image
    info_topic: /camera/camera_info
    min_area_px: 150.0
    max_area_px: 3000.0     # a 4 cm cube from 1 m is about 500 px^2 at 640x480
    min_solidity: 0.85
    max_aspect_ratio: 1.6
